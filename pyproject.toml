[project]
name = "freeagent-cli"
version = "0.6.0"
description = "CLI for submitting FreeAgent timeslips"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tom Dyson", email = "tom@naive.co.uk" }]
keywords = ["freeagent", "cli", "timetracking", "timeslip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/tomdyson/freeagent-cli"
Repository = "https://github.com/tomdyson/freeagent-cli"
Issues = "https://github.com/tomdyson/freeagent-cli/issues"

[project.scripts]
freeagent-cli = "freeagent_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freeagent_cli"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14",
]

[tool.ruff]
# Wide enough for the existing tab-separated click.echo lines and help epilogs,
# which read worse wrapped than long.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
    # `date.today()` is correct here. Timeslips and bank transactions are dated
    # in the user's local day; a tz-aware UTC date would file work on the wrong
    # day either side of midnight. Kept out of `select` rather than noqa'd at
    # each of the three call sites.
    "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
# Tests lean on long inline fixtures where wrapping hurts more than it helps.
"tests/*" = ["E501"]
